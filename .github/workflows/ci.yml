name: GRC Control Center CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      rls_base_sha:
        description: Exact base commit for the fail-closed RLS regression proof
        required: true
        type: string

permissions:
  contents: read

jobs:
  deployment-control:
    name: Vercel deployment control
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify fail-closed policy
        run: npm run v700:vercel-deployment-policy

  validation:
    name: Build, Test, Security, Proof
    needs: deployment-control
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Hermetic proof suite
        env:
          GRC_RLS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.rls_base_sha }}
        run: npm run proof:ci
